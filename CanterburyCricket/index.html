<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#070912" />
    <title>Canterbury Cricket Club | Ottawa Cricket Club Since 1983</title>
    <meta name="description" content="Canterbury Cricket Club is an Ottawa cricket club, playing in the Ottawa Valley Cricket Council since 1983. New players welcome at Lynda Lane Park." />
    <link rel="canonical" href="https://canterburycricketclub.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="/club-icon.png" />
    <style>
      /* Intro scan overlay (public/intro/bat-scan.js). Hidden unless the bootstrap below shows it. */
      #ccIntro{position:fixed;inset:0;z-index:2147483000;background:#05070d;display:grid;place-items:center;cursor:pointer;transition:opacity .45s ease}
      #ccIntro[hidden]{display:none}
      #ccIntro pre{margin:0;color:#f6f2ea;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:0;white-space:pre;user-select:none;opacity:.92}
      #ccIntro canvas{position:absolute;inset:0;pointer-events:none}
      #ccIntro.is-leaving{opacity:0}
      html.cc-intro{overflow:hidden}
    </style>
  </head>
  <body>
    <div id="ccIntro" hidden aria-hidden="true"><pre></pre><canvas></canvas></div>
    <script>
      // Show the bat-scan intro once per visit, never to crawlers or to people who prefer reduced motion.
      (function () {
        try {
          var n = navigator, seen = sessionStorage.getItem("ccIntroSeen");
          var bot = n.webdriver || /bot|crawl|spider|slurp|preview|facebookexternalhit/i.test(n.userAgent);
          var calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (seen || bot || calm) return;
          sessionStorage.setItem("ccIntroSeen", "1");
          document.getElementById("ccIntro").hidden = false;
          document.documentElement.classList.add("cc-intro");
          var s = document.createElement("script"); s.src = "/intro/bat-scan.js"; s.async = true;
          document.head.appendChild(s);
        } catch (e) { /* storage blocked: just skip the intro */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
